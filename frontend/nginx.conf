server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with content hash can be cached safely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # PWA Web Manifest & Service Worker must always serve exact MIME types and fresh headers
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/servio-staging.apk {
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        add_header Content-Disposition 'attachment; filename="yvs-computer-staging.apk"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /downloads/ {
        types { application/vnd.android.package-archive apk; application/json json; }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached to ensure users always receive latest chunk hashes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
