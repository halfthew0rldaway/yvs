name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on VPS..."
            cd ~/servio

            echo "📥 Syncing latest changes from Git..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ] && [ -f .env.production ]; then
              cp .env.production .env
            fi

            echo "🐳 Rebuilding and updating Docker containers..."
            docker compose --env-file .env.production up -d --build

            echo "⏳ Waiting for Serv.io Backend API to initialize and become healthy..."
            READY=false
            for i in $(seq 1 45); do
              HTTP_STATUS=$(docker compose --env-file .env.production exec -T backend node -e "
                require('http').get('http://127.0.0.1:5000/', (res) => {
                  process.stdout.write(String(res.statusCode));
                  process.exit(0);
                }).on('error', () => {
                  process.stdout.write('000');
                  process.exit(0);
                });
              " 2>/dev/null || echo "000")

              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Serv.io Backend API is up, database is synchronized, and responding with HTTP 200 OK."
                READY=true
                break
              fi
              echo "Waiting for backend API initialization (attempt $i/45, current status: $HTTP_STATUS)..."
              sleep 2
            done

            if [ "$READY" != "true" ]; then
              echo "❌ Backend failed to become healthy within 90 seconds. Dumping container logs:"
              docker compose --env-file .env.production logs backend --tail 50
              exit 1
            fi

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"

