name: Auto Deploy to Production (komputerawet.com)

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [PROD] Memulai Deployment Production di VPS..."

            # Deteksi direktori proyek di VPS (prioritaskan ~/yvs-production, fallback ~/servio)
            if [ -d "$HOME/yvs-production" ]; then
              TARGET_DIR="$HOME/yvs-production"
            elif [ -d "$HOME/servio" ]; then
              TARGET_DIR="$HOME/servio"
            else
              TARGET_DIR="$HOME/yvs-production"
              mkdir -p "$TARGET_DIR"
              git clone -b main https://github.com/halfthew0rldaway/yvs.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📂 Working directory: $TARGET_DIR"

            echo "📥 Mengambil perubahan terbaru dari branch main..."
            git fetch origin main
            git reset --hard origin/main

            # Pastikan network gateway bersama aktif
            docker network inspect yvs_gateway_net >/dev/null 2>&1 || docker network create yvs_gateway_net

            # Pastikan file env tersedia
            if [ ! -f .env.production ] && [ -f .env ]; then
              cp .env .env.production
            elif [ ! -f .env.production ] && [ -f .env.production.example ]; then
              cp .env.production.example .env.production
            fi

            COMPOSE_FILE="compose.prod.yaml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              COMPOSE_FILE="compose.yaml"
            fi

            echo "🐳 Membangun dan menjalankan kontainer Production ($COMPOSE_FILE)..."
            docker compose -f "$COMPOSE_FILE" --env-file .env.production up -d --build

            echo "⏳ Menunggu kontainer backend Production running..."
            for i in $(seq 1 30); do
              STATUS=$(docker compose -f "$COMPOSE_FILE" --env-file .env.production ps --format '{{.State}}' backend 2>/dev/null || true)
              if [ "$STATUS" = "running" ]; then
                echo "✅ Backend Production berhasil aktif."
                break
              fi
              echo "Menunggu backend (percobaan $i/30, status saat ini: $STATUS)..."
              sleep 2
            done

            echo "⏳ Inisialisasi container database & migrasi..."
            sleep 6

            echo "📋 Log inisialisasi backend:"
            docker compose -f "$COMPOSE_FILE" --env-file .env.production logs backend --tail 20

            # Reload Caddy Gateway jika aktif
            if docker ps --format '{{.Names}}' | grep -q "caddy-gateway"; then
              echo "🔄 Me-reload konfigurasi Caddy Gateway..."
              docker exec caddy-gateway caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi

            echo "🧹 Membersihkan image lama..."
            docker image prune -f

            echo "🎉 [PROD] Deployment Production Sukses! Akses: https://${PROD_DOMAIN:-komputerawet.com}"
