name: Auto Deploy to Staging (staging.komputerawet.com)

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🧪 [STAGING] Memulai Deployment Staging di VPS..."

            TARGET_DIR="$HOME/yvs-staging"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📂 Membuat direktori $TARGET_DIR..."
              git clone -b staging https://github.com/halfthew0rldaway/yvs.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📂 Working directory: $TARGET_DIR"

            echo "📥 Mengambil perubahan terbaru dari branch staging..."
            git fetch origin staging
            git reset --hard origin/staging

            # Pastikan network gateway bersama aktif
            docker network inspect yvs_gateway_net >/dev/null 2>&1 || docker network create yvs_gateway_net

            # Pastikan file env staging tersedia
            if [ ! -f .env.staging ]; then
              if [ -f .env.staging.example ]; then
                cp .env.staging.example .env.staging
                # Generate random credentials jika baru
                sed -i "s/change_this_staging_password_secure/$(openssl rand -hex 16)/g" .env.staging
                sed -i "s/change_this_staging_root_password_secure/$(openssl rand -hex 16)/g" .env.staging
                sed -i "s/change_this_staging_jwt_secret_key_minimum_32_characters/$(openssl rand -hex 32)/g" .env.staging
              fi
            fi

            echo "🐳 Membangun dan menjalankan kontainer Staging (compose.staging.yaml)..."
            docker compose -f compose.staging.yaml --env-file .env.staging up -d --build

            echo "⏳ Menunggu kontainer backend Staging running..."
            for i in $(seq 1 30); do
              STATUS=$(docker compose -f compose.staging.yaml --env-file .env.staging ps --format '{{.State}}' backend 2>/dev/null || true)
              if [ "$STATUS" = "running" ]; then
                echo "✅ Backend Staging berhasil aktif."
                break
              fi
              echo "Menunggu backend staging (percobaan $i/30, status saat ini: $STATUS)..."
              sleep 2
            done

            echo "⏳ Inisialisasi container database staging & migrasi..."
            sleep 6

            echo "📋 Log inisialisasi backend staging:"
            docker compose -f compose.staging.yaml --env-file .env.staging logs backend --tail 20

            # Reload Caddy Gateway jika aktif
            if docker ps --format '{{.Names}}' | grep -q "caddy-gateway"; then
              echo "🔄 Me-reload konfigurasi Caddy Gateway..."
              docker exec caddy-gateway caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi

            echo "🧹 Membersihkan image lama..."
            docker image prune -f

            echo "🎉 [STAGING] Deployment Staging Sukses! Akses: https://${STAGING_DOMAIN:-staging.komputerawet.com}"
