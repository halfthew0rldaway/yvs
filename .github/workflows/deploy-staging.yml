name: Auto Deploy to Staging (staging.komputerawet.com)

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build current staging APK
        working-directory: frontend
        env:
          SERVIO_VERSION_CODE: ${{ github.run_number }}
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          bash ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/servio-staging.apk"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.env.GITHUB_WORKSPACE+"/servio-staging.json", JSON.stringify({commit:process.env.GITHUB_SHA,build:new Date().toISOString(),versionCode:Number(process.env.SERVIO_VERSION_CODE)})+"\n")'

      - name: Upload APK to staging VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "servio-staging.apk,servio-staging.json"
          target: "/tmp/yvs-staging-apk-${{ github.run_id }}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🧪 [STAGING] Memulai Deployment Staging di VPS..."

            TARGET_DIR="$HOME/yvs-staging"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📂 Membuat direktori $TARGET_DIR..."
              git clone -b staging https://github.com/halfthew0rldaway/yvs.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📂 Working directory: $TARGET_DIR"

            echo "📥 Mengambil perubahan terbaru dari branch staging..."
            git fetch origin staging
            git reset --hard origin/staging

            mkdir -p apk-downloads
            install -m 0644 "/tmp/yvs-staging-apk-${{ github.run_id }}/servio-staging.apk" apk-downloads/servio-staging.apk
            install -m 0644 "/tmp/yvs-staging-apk-${{ github.run_id }}/servio-staging.json" apk-downloads/servio-staging.json
            rm -rf "/tmp/yvs-staging-apk-${{ github.run_id }}"

            # Pastikan network gateway bersama aktif
            docker network inspect yvs_gateway_net >/dev/null 2>&1 || docker network create yvs_gateway_net

            # Pastikan file env staging tersedia
            if [ ! -f .env.staging ]; then
              if [ -f .env.staging.example ]; then
                cp .env.staging.example .env.staging
                # Generate random credentials jika baru
                sed -i "s/change_this_staging_password_secure/$(openssl rand -hex 16)/g" .env.staging
                sed -i "s/change_this_staging_root_password_secure/$(openssl rand -hex 16)/g" .env.staging
                sed -i "s/change_this_staging_jwt_secret_key_minimum_32_characters/$(openssl rand -hex 32)/g" .env.staging
              fi
            fi

            echo "🐳 Membangun dan menjalankan kontainer Staging (compose.staging.yaml)..."
            docker compose -f compose.staging.yaml --env-file .env.staging up -d --build

            echo "⏳ Menunggu kontainer backend Staging running..."
            for i in $(seq 1 30); do
              STATUS=$(docker compose -f compose.staging.yaml --env-file .env.staging ps --format '{{.State}}' backend 2>/dev/null || true)
              if [ "$STATUS" = "running" ]; then
                echo "✅ Backend Staging berhasil aktif."
                break
              fi
              echo "Menunggu backend staging (percobaan $i/30, status saat ini: $STATUS)..."
              sleep 2
            done

            echo "⏳ Inisialisasi container database staging & migrasi..."
            sleep 6

            echo "📋 Log inisialisasi backend staging:"
            docker compose -f compose.staging.yaml --env-file .env.staging logs backend --tail 20

            docker exec yvs-staging-frontend test -s /usr/share/nginx/html/downloads/servio-staging.apk
            docker exec yvs-staging-frontend test -s /usr/share/nginx/html/downloads/servio-staging.json

            # Reload Caddy Gateway jika aktif
            if docker ps --format '{{.Names}}' | grep -q "caddy-gateway"; then
              echo "🔄 Me-reload konfigurasi Caddy Gateway..."
              docker exec caddy-gateway caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi

            echo "🧹 Membersihkan image lama..."
            docker image prune -f

            echo "🎉 [STAGING] Deployment Staging Sukses! Akses: https://${STAGING_DOMAIN:-staging.komputerawet.com}"
