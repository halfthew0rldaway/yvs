name: servio_technician
description: "Serv.io Workshop - Mobile Technician Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & State
  dio: ^5.4.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Presentation (Clean solid design system)
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # Hardware & Device Utilities
  mobile_scanner: ^5.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

