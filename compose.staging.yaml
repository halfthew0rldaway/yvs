# ==============================================================================
# Serv.io / YVS - Staging Environment (R&D Preview)
# Dipicu oleh push ke branch 'staging' (staging.komputerawet.com)
# ==============================================================================

name: yvs-staging

services:
  db:
    image: mysql:8.0
    container_name: yvs-staging-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yvs_staging}
      MYSQL_USER: ${MYSQL_USER:-yvs_staging}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - yvs_staging_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 640m
    networks:
      - internal
      - yvs_gateway_net

  backend:
    build:
      context: ./backend
    container_name: yvs-staging-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "mysql://${MYSQL_USER:-yvs_staging}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-yvs_staging}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    volumes:
      - yvs_staging_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    mem_limit: 384m
    networks:
      - internal
      - yvs_gateway_net

  frontend:
    build:
      context: ./frontend
    container_name: yvs-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    mem_limit: 192m
    networks:
      - internal
      - yvs_gateway_net

networks:
  internal:
  yvs_gateway_net:
    external: true

volumes:
  yvs_staging_mysql_data:
  yvs_staging_uploads:
